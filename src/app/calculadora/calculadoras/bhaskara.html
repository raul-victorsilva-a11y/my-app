<h1>Bhaskara</h1>

<input type="text" id="aValue" />x² +

<input type="text" id="bValue" />x +

<input type="text" id="cValue" /> = 0

<br>

<input type="button" onclick="calcular()" value="Calcular" />

<br>

<p id="display"></p>

<script>

    function calcular() {

        let a = document.getElementById("aValue").value
        let b = document.getElementById("bValue").value
        let c = document.getElementById("cValue").value

        let display = document.getElementById("display")

        if (isNaN(a) || isNaN(b) || isNaN(c)) {
            alert("A, B e C invalidos")
            return
        }

        a = Number(a)
        b = Number(b)
        c = Number(c)

        let delta = b ** 2;
        delta = delta - 4 * a * c;

        if (delta < 0) {
            alert("valor de delta negtivo")
            return

        } else if (delta == 0) {
            alert("valor de delta igual a zero")
            return
        }

        let x1;
        let x2;

        b = b * -1;

        x1 = ((b - delta ** 0.5) / (2 * a));
        x2 = ((b + delta ** 0.5) / (2 * a));

        display.textContent = `x1 = ${x1} e x2 = ${x2}`
    }

</script>
